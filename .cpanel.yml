# How cPanel publishes this repo when you press "Deploy HEAD Commit".
#
# Only the files that make up the public website are copied. The repo itself
# lives outside the web root, so anything not listed here — this file, the
# README, git's own folder — is never reachable from the internet.
---
deployment:
  tasks:
    - export DEPLOYPATH=/home/apexcorner/public_html/
    - /bin/cp index.html      $DEPLOYPATH
    - /bin/cp waitlist.html   $DEPLOYPATH
    - /bin/cp subscribe.html  $DEPLOYPATH
    - /bin/cp support.html    $DEPLOYPATH
    - /bin/cp privacy.html    $DEPLOYPATH
    - /bin/cp terms.html      $DEPLOYPATH
    - /bin/cp 404.html        $DEPLOYPATH
    # ⛔ ADDED 30 Aug 2026. This file copies BY NAME, one line per file, so a new
    # page or folder that nobody adds here is simply never published — the site
    # goes live pointing at things that 404, and it looks like a broken deploy
    # rather than a missing line. success.html is the post-checkout page; shots/
    # holds the product screenshots the landing page is built around.
    - /bin/cp success.html    $DEPLOYPATH
    - /bin/mkdir -p           $DEPLOYPATH/shots
    - /bin/cp -R shots/.      $DEPLOYPATH/shots/
    - /bin/cp boutiq-glove.png          $DEPLOYPATH
    - /bin/cp boutiq-wordmark.png       $DEPLOYPATH
    - /bin/cp boutiq-icon-apple-ready.png $DEPLOYPATH
    - /bin/cp .htaccess       $DEPLOYPATH
    - /bin/cp robots.txt      $DEPLOYPATH
    - /bin/cp sitemap.xml     $DEPLOYPATH
